services:
  scylladb:
    image: scylladb/scylla:6.2
    container_name: localbase-scylladb
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --authenticator PasswordAuthenticator
      --authorizer CassandraAuthorizer
    ports:
      - "9042:9042"
      - "9160:9160"
      - "10000:10000"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

  meta:
    build:
      context: ./scylladb-meta
      dockerfile: Dockerfile
    container_name: localbase-scylladb-meta
    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: cassandra
      SCYLLA_PASSWORD: cassandra
      META_API_HOST: 0.0.0.0
      META_API_PORT: 8080
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      scylladb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: localbase-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    restart: unless-stopped

  storage:
    build:
      context: ./storage
      dockerfile: Dockerfile
    container_name: localbase-storage
    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: cassandra
      SCYLLA_PASSWORD: cassandra
      STORAGE_API_HOST: 0.0.0.0
      STORAGE_API_PORT: 8081
      CORS_ORIGIN: http://localhost:3000
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
      MINIO_REGION: us-east-1
    ports:
      - "8081:8081"
    depends_on:
      scylladb:
        condition: service_healthy
      minio:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: ./scylladb-api
      dockerfile: Dockerfile
    container_name: localbase-scylladb-api
    environment:
      SCYLLA_HOST: scylladb
      SCYLLA_PORT: 9042
      SCYLLA_USERNAME: cassandra
      SCYLLA_PASSWORD: cassandra
      SCYLLA_KEYSPACE: public
      API_HOST: 0.0.0.0
      API_PORT: 8082
      CORS_ORIGIN: http://localhost:3000
    ports:
      - "8082:8082"
    depends_on:
      scylladb:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  studio:
    build:
      context: ./studio
      dockerfile: Dockerfile
    container_name: localbase-studio
    environment:
      NUXT_PUBLIC_API_BASE: http://localhost:8080
      NUXT_PUBLIC_STORAGE_BASE: http://localhost:8081
      NITRO_HOST: 0.0.0.0
      NITRO_PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      meta:
        condition: service_healthy
      storage:
        condition: service_healthy
    restart: unless-stopped

volumes:
  scylla-data:
  minio-data:
