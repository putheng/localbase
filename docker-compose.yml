services:
  scylladb:
    image: scylladb/scylla:6.2
    container_name: localbase-scylladb
    command: >
      --smp 1
      --memory 750M
      --overprovisioned 1
      --developer-mode 1
      --authenticator PasswordAuthenticator
      --authorizer CassandraAuthorizer
    ports:
      - "9042:9042"
      - "9160:9160"
      - "10000:10000"
    volumes:
      - scylla-data:/var/lib/scylla
    healthcheck:
      test: ["CMD-SHELL", "nodetool status || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 40s
    restart: unless-stopped

volumes:
  scylla-data:
