[package]
name = "storage"
version = "0.1.0"
edition = "2024"

[dependencies]
actix-cors = "0.7"
actix-multipart = "0.7"
actix-web = "4"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-credential-types = "1"
bytes = "1"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
env_logger = "0.11"
futures-util = "0.3"
log = "0.4"
mime = "0.3"
scylla = "0.15"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
